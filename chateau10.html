<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Château Cantenac – Rallye</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <img src="images/logorv4h.png" class="brand-logo">
        <span class="brand-title">Rallye des Vin'4Heures</span>
        <img src="images/logoaoc.png" class="brand-logo">
      </div>
    </div>
  </header>

  <main class="card">

    <h2>Château Cantenac 🍷</h2>

    <p class="subtitle">Entrez votre code équipe</p>

    <input type="text" id="code" placeholder="Code équipe">
    <button id="btn-code">Valider</button>

    <p id="message"></p>

    <form id="qcm" style="display:none;">
      <h3>QCM</h3>

      <p>1) Appelation ?</p>
      <label><input type="radio" name="q1" value="A"> Pomerol</label>
      <label><input type="radio" name="q1" value="B"> Saint-Émilion</label>
      <label><input type="radio" name="q1" value="C"> Saint-Émilion Grand Cru</label>

      <p>2) Date de création du chateau ?</p>
      <label><input type="radio" name="q2" value="A"> 1822</label>
      <label><input type="radio" name="q2" value="B"> 1826</label>
      <label><input type="radio" name="q2" value="C"> 1832</label>

      <p>3) Surface ?</p>
      <label><input type="radio" name="q3" value="A"> 19ha</label>
      <label><input type="radio" name="q3" value="B"> 23ha</label>
      <label><input type="radio" name="q3" value="C"> 21ha</label>

      <p>4) Qu’est-ce qu’un vin “fermé” ?</p>
      <label><input type="radio" name="q4" value="A"> Un vin peu expressif</label>
      <label><input type="radio" name="q4" value="B"> Un vin bouchonné</label>
      <label><input type="radio" name="q4" value="C"> Un vin trop vieux</label>

      <p>5) Que signifie “astringence” ?</p>
      <label><input type="radio" name="q5" value="A"> Sensation sucrée</label>
      <label><input type="radio" name="q5" value="B"> Sensation d’assèchement en bouche</label>
      <label><input type="radio" name="q5" value="C"> Sensation minérale</label>

      <p>6) Quel facteur influence principalement l’acidité naturelle d’un vin ?</p>
      <label><input type="radio" name="q6" value="A"> Le climat</label>
      <label><input type="radio" name="q6" value="B"> Le bouchon</label>
      <label><input type="radio" name="q6" value="C"> Le type de bouteille</label>

      <button type="button" id="valider">Valider</button>
    </form>

  </main>

  <script src="equipes.js" defer></script>
  <script src="tracking.js" defer></script>
  <script src="qcm.js" defer></script>

</body>
</html>
