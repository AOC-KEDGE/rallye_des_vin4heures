<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Château Bellevue – Rallye</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <img src="images/logorv4h.png" class="brand-logo">
        <span class="brand-title">Rallye des Vin'4Heures</span>
        <img src="images/logoaoc.png" class="brand-logo">
      </div>
    </div>
  </header>

  <main class="card">

    <h2>Château Bellevue 🍷</h2>

    <p class="subtitle">Entrez votre code équipe</p>

    <input type="text" id="code" placeholder="Code équipe">
    <button id="btn-code">Valider</button>

    <p id="message"></p>

    <form id="qcm" style="display:none;">
      <h3>QCM</h3>

      <p>1) Type de sol ?</p>
      <label><input type="radio" name="q1" value="A"> Argilo-calcaire</label>
      <label><input type="radio" name="q1" value="B"> Sableux</label>
      <label><input type="radio" name="q1" value="C"> Granitique</label>

      <p>2) Cépage principal ?</p>
      <label><input type="radio" name="q2" value="A"> Cabernet</label>
      <label><input type="radio" name="q2" value="B"> Sauvignon</label>
      <label><input type="radio" name="q2" value="C"> Merlot</label>

      <p>3) Surface ?</p>
      <label><input type="radio" name="q3" value="A"> 3ha</label>
      <label><input type="radio" name="q3" value="B"> 5ha</label>
      <label><input type="radio" name="q3" value="C"> 7ha</label>

      <p>4) Qu’est-ce qu’un vin “millésimé” ?</p>
      <label><input type="radio" name="q4" value="A"> Un vin pétillant</label>
      <label><input type="radio" name="q4" value="B"> Un vin assemblé de plusieurs années</label>
      <label><input type="radio" name="q4" value="C"> Un vin issu d’une seule année de récolte</label>

      <p>5) Pourquoi les vins de Sauternes sont-ils si sucrés ?</p>
      <label><input type="radio" name="q5" value="A"> On ajoute du sucre après fermentation pour l'arrêter</label>
      <label><input type="radio" name="q5" value="B"> Les raisins sont concentrés par la pourriture noble</label>
      <label><input type="radio" name="q5" value="C"> Les raisins sont récoltés très tôt</label>

      <p>6) Quel cépage blanc domine dans les vins de Chablis ?</p>
      <label><input type="radio" name="q6" value="A"> Chardonnay</label>
      <label><input type="radio" name="q6" value="B"> Sauvignon blanc</label>
      <label><input type="radio" name="q6" value="C"> Chenin blanc</label>

      <button type="button" id="valider">Valider</button>
    </form>

  </main>

  <script src="equipes.js" defer></script>
  <script src="tracking.js" defer></script>
  <script src="qcm.js" defer></script>

</body>
</html>
