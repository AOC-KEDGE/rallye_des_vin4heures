<section class="card">
  <h2>Château Martinet</h2>

  <h3>Entrez votre code équipe</h3>
  <input type="text" id="code" placeholder="Code équipe">
  <button id="btn-code">Valider</button>
  <p id="message"></p>

  <form id="qcm" style="display:none;">
    <h3>QCM</h3>

    <p>1) Quel est le type de sol ?</p>
    <label><input type="radio" name="q1" value="A"> Sableux</label><br>
    <label><input type="radio" name="q1" value="B"> Argilo-calcaire</label><br>
    <label><input type="radio" name="q1" value="C"> Granitique</label><br>

    <p>2) Cépage principal ?</p>
    <label><input type="radio" name="q2" value="A"> Cabernet</label><br>
    <label><input type="radio" name="q2" value="B"> Merlot</label><br>
    <label><input type="radio" name="q2" value="C"> Sauvignon</label><br>

    <p>3) Surface ?</p>
    <label><input type="radio" name="q3" value="A"> 10ha</label><br>
    <label><input type="radio" name="q3" value="B"> 17ha</label><br>
    <label><input type="radio" name="q3" value="C"> 30ha</label><br>

    <button type="button" id="valider">Valider</button>
  </form>
</section>

<script src="equipes.js"></script>
<script src="tracking.js"></script>
<script src="qcm.js"></script>
