<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Château Haut-Piquat – Rallye</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <img src="images/logorv4h.png" class="brand-logo">
        <span class="brand-title">Rallye des Vin'4Heures</span>
        <img src="images/logoaoc.png" class="brand-logo">
      </div>
    </div>
  </header>

  <main class="card">

    <h2>Château Haut-Piquat 🍷</h2>

    <p class="subtitle">Entrez votre code équipe</p>

    <input type="text" id="code" placeholder="Code équipe">
    <button id="btn-code">Valider</button>

    <p id="message"></p>

    <form id="qcm" style="display:none;">
      <h3>QCM</h3>

      <p>1) Appellation ?</p>
      <label><input type="radio" name="q1" value="A"> Saint-Émilion</label>
      <label><input type="radio" name="q1" value="B"> Saint-Émilion Grand Cru</label>
      <label><input type="radio" name="q1" value="C"> Lussac Saint-Émilion</label>

      <p>2) Type de vendanges ?</p>
      <label><input type="radio" name="q2" value="A"> Manuelle</label>
      <label><input type="radio" name="q2" value="B"> Mécanique</label>
      <label><input type="radio" name="q2" value="C"> Les deux</label>

      <p>3) Surface ?</p>
      <label><input type="radio" name="q3" value="A"> 20ha</label>
      <label><input type="radio" name="q3" value="B"> 22ha</label>
      <label><input type="radio" name="q3" value="C"> 24ha</label>

      <p>4) Qu’est-ce qu’un Champagne “brut” ?</p>
      <label><input type="radio" name="q4" value="A"> Très sucré</label>
      <label><input type="radio" name="q4" value="B"> Peu sucré</label>
      <label><input type="radio" name="q4" value="C"> Monocépage</label>

      <p>5) Qu’est-ce qu’une “caudalie” en dégustation ?</p>
      <label><input type="radio" name="q5" value="A"> Une unité de mesure du sucre</label>
      <label><input type="radio" name="q5" value="B"> Une unité de mesure de l’acidité</label>
      <label><input type="radio" name="q5" value="C"> Une unité de mesure du temps en bouche</label>

      <p>6) Quel est le principal risque d’une vendange trop tardive ?</p>
      <label><input type="radio" name="q6" value="A"> Trop d’acidité</label>
      <label><input type="radio" name="q6" value="B"> Manque d’équilibre</label>
      <label><input type="radio" name="q6" value="C"> Absence de couleur</label>

      <button type="button" id="valider">Valider</button>
    </form>

  </main>

  <script src="equipes.js" defer></script>
  <script src="tracking.js" defer></script>
  <script src="qcm.js" defer></script>

</body>
</html>
